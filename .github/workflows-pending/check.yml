name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 'make check' is the ONE definition of passing -- the same target a
      # human, the Claude Code hooks and the pre-push gate call. CI having its
      # own list of checks is how the lists drift.
      - name: make check
        run: make check
